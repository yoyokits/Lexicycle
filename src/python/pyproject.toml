[project]
name = "lexicycle-data"
version = "0.1.0"
description = "Offline tooling that turns Wiktionary dumps into Lexicycle's small bundled dictionary. Not shipped with the app."
requires-python = ">=3.11"
dependencies = [
    "huggingface-hub>=0.27",
    "pyarrow>=18.0",
    "wordfreq>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
lexicycle-data = "lexicycle_data.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lexicycle_data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
